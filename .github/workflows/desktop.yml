name: Desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15
            arch: x64
          - os: windows-latest
            arch: x64
          - os: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: npm ci --prefix desktop
      - name: Build native backend and desktop packages
        run: node scripts/build-desktop.js --dist --arch=${{ matrix.arch }}
      - name: Test navigation and backend lifecycle
        # An x64 Go backend can run under Rosetta on the macOS ARM runner.
        run: npm test --prefix desktop
      - uses: actions/upload-artifact@v4
        with:
          name: faah-desktop-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.deb
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    # Needs every platform, so a failed build never ships a partial set.
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: faah-desktop-*
          path: dist/desktop
          merge-multiple: true
      # release.yml publishes the same tag, and either workflow may finish first.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/desktop/*
