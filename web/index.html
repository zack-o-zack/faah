<!doctype html>
<html lang="en" data-theme="catppuccin-mocha">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>faah</title>
<link rel="icon" type="image/svg+xml" href="static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/app.css">
<!-- Every web/themes/*.css joined by the server. See docs/internals/styling-and-themes.md. -->
<link rel="stylesheet" href="static/themes.css">
</head>
<body class="right-hidden threads-hidden">
<div id="app" class="flex h-dvh overflow-hidden">
  <!-- SECTION: Sidebar (File explorer tree) -->
  <div id="sidebar-root" class="contents"></div>

  <!-- SECTION: Main Editor Area -->
  <main id="main" class="relative flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden">
    <!-- Top Control Bar (Level 1 Menu) -->
    <header id="main-top-bar" class="main-top-bar desktop:min-h-[var(--titlebar-h,2.5rem)] desktop:[-webkit-app-region:drag] desktop:[&_button]:[-webkit-app-region:no-drag] desktop:[&_a]:[-webkit-app-region:no-drag] desktop:[&_[role=group]]:[-webkit-app-region:no-drag] desktop:[&_[role=tab]]:[-webkit-app-region:no-drag] [body.side-hidden_&]:desktop:pl-[calc(0.5rem+var(--titlebar-left,0px))] desktop:pr-[calc(0.5rem+var(--titlebar-right,0px))] relative z-[7] flex shrink-0 items-center justify-between gap-2 border-b bg-sidebar px-2 py-1">
      <!-- Desktop app on Windows and Linux only (desktop variants, desktop/preload.cjs) -->
      <button data-desktop-menu title="Menu" aria-label="Application menu" class="btn desktop-menu-btn hidden! win-linux:inline-flex!" data-control="header-action" data-variant="ghost" data-size="xs">
        <span class="icon-[lucide--menu] size-3 shrink-0" aria-hidden="true"></span>
      </button>
      <span id="review-toggle-root" class="contents"></span>
      <div class="main-top-bar-spacer flex-1"></div>
      <!-- Project name, centred on the bar -->
      <!-- Sized to the name alone, so it never sits over the bar's buttons -->
      <div data-ui="top-title" class="absolute left-1/2 flex min-w-0 max-w-[min(24rem,40%)] -translate-x-1/2 items-center gap-1">
        <span id="root-name" class="min-w-0 truncate text-xs font-medium text-muted-foreground"></span>
      </div>

      <div id="view-switches" class="flex items-center gap-1">
        <!-- Threads button -->
        <span id="threads-toggle-root" class="contents"></span>
        <!-- Opens/toggles the right sidebar inspector (LSP & Tips) -->
        <span id="inspector-toggle-root" class="contents"></span>
      </div>
    </header>

    <!-- File Tabs (Level 2: directly below top menu bar) -->
    <div id="editor-tabs-root" class="contents"></div>

    <!-- Virtualized Code Editor Viewport -->
    <div id="editor" class="relative min-h-0 flex-1 overflow-hidden bg-background">
      <!-- #viewport handles scrolling; #sizer sets full document scroll height; #rows renders only visible DOM rows -->
      <div id="editor-source-root" class="contents"></div>
      <!-- Direct editing overlay -->

      <!-- Preview: covers the code view for a Markdown tab, or a CSV/TSV tab as a table (Alt+M toggles) -->
      <div id="viewers-root" class="contents"></div>
      <div id="editor-minimap-root" class="contents"></div>

      <!-- Welcome / Empty State Screen -->
      <div id="empty" class="absolute inset-0 grid place-items-center bg-background">
        <div class="empty text-muted-foreground">
          <div class="flex justify-center items-end gap-2 mb-6">
            <img class="hidden dark:block" src="static/logo-dark.svg" alt="faah" width="160" height="60">
            <img class="block dark:hidden" src="static/logo-light.svg" alt="faah" width="160" height="60">
            <span id="empty-ver" class="font-mono text-xs text-primary-text"></span>
          </div>
          <dl class="grid grid-cols-[auto_auto] items-center gap-x-4 gap-y-2 text-sm [&_dt]:flex [&_dt]:justify-end [&_dt]:gap-1 [&_dd]:text-left [&_dd]:text-muted-foreground">
            <dt data-caps="Mod+K"></dt><dd>quick search / palette</dd>
            <dt data-caps="Mod+P"></dt><dd>go to file</dd>
            <dt data-caps="Mod+Shift+F"></dt><dd>search everywhere</dd>
            <dt data-caps="Mod+Shift+O"></dt><dd>go to symbol</dd>
            <dt data-caps="Mod+F"></dt><dd>find in file</dd>
            <dt data-caps="Mod+G"></dt><dd>go to line</dd>
            <dt data-caps="F12"></dt><dd>go to definition</dd>
            <dt data-caps="Shift+F12"></dt><dd>find all references</dd>
            <dt>hover</dt><dd>type and docs</dd>
            <dt data-caps="Mod+,"></dt><dd>settings</dd>
            <dt data-caps="?"></dt><dd>all shortcuts</dd>
          </dl>
        </div>
      </div>

      <!-- Hovercard: Type signature, documentation, and quick AI/Usages actions -->


      <!-- Top-right corner of the editor: find bar, then the explanation orb -->
      <div data-ui="editor-corner" class="pointer-events-none absolute top-2 right-2 z-20 flex max-w-[calc(100%_-_16px)] flex-col items-end gap-2 *:pointer-events-auto">


        <div id="explanation-root" class="contents"></div>
      </div>



    </div>

    <div id="review-root" class="contents"></div>

    <div id="pr-root" class="contents"></div>

    <!-- Floating Copy Toast Notification -->
    <div id="solid-root"></div>

    <!-- Selection context menu: the footer's selection actions, at the pointer -->




    <!-- Commit card: author, message and diffstat for a hovered unpushed commit -->

    <!-- Metrics menu, opened from CPU/RAM status bar -->

    <!-- LSP management menu, opened from LSP status bar button -->

    <div id="status-root" class="contents"></div>
  </main>

  <div id="right-sidebar-root" class="contents"></div>

  <!-- Threads Resizer Divider -->
  <div id="threads-resizer-root" class="contents"></div>

  <!-- SECTION: Dedicated Threads Sidebar -->
  <div id="threads-root" class="contents"></div>
</div>

<!-- SECTION: Command / File / Symbol Palette Modal (Cmd+K / Ctrl+P) -->


<!-- SECTION: Keyboard Shortcuts Cheat Sheet Overlay (?) -->
<dialog id="helpsheet" class="dialog"></dialog>

<!-- SECTION: Settings Modal (Cmd+, / Ctrl+,) -->


<dialog id="settings-modal" class="dialog">
  <div class="sm:max-w-[1180px] h-[min(840px,92vh)] overflow-hidden gap-0" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header class="flex-row! items-center gap-4 shrink-0">
      <div class="flex min-w-0 flex-1 flex-col gap-0.5">
        <h2 id="settings-title">Settings</h2>
        <button type="button" id="settings-path" class="self-start truncate font-mono text-xs text-muted-foreground hover:text-foreground" title="Click to copy path">~/.faah/settings.json</button>
      </div>
      <div id="settings-search-bar" data-ui="settings-search-bar" class="relative w-72">
        <span class="icon-[lucide--search] size-3.5 shrink-0 pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-muted-foreground" aria-hidden="true"></span>
        <input type="search" id="settings-search" aria-label="Search settings" placeholder="Search settings" autocomplete="off" spellcheck="false" class="input w-full pl-8 pr-8">
        <button id="settings-search-clear" title="Clear search" class="btn absolute right-1 top-1/2 -translate-y-1/2" data-control="icon-action" data-variant="ghost" data-size="icon-xs" aria-label="Clear search"><span class="icon-[lucide--x] size-3.5 shrink-0" aria-hidden="true"></span></button>
      </div>
      <div class="button-group" role="group" aria-label="Settings view">
        <button type="button" id="settings-mode-ui" title="Settings UI" class="btn" data-variant="secondary" data-size="sm" aria-pressed="true">UI</button>
        <button type="button" id="settings-mode-json" title="Edit settings.json" class="btn" data-variant="outline" data-size="sm">JSON</button>
      </div>
      <button id="settings-close" title="Close (Esc)" class="btn" data-control="mini settings-close-btn" data-variant="ghost" data-size="icon-sm" aria-label="Close settings"><span class="icon-[lucide--x] size-3.5 shrink-0" aria-hidden="true"></span></button>
    </header><section class="-mx-6 flex min-h-0 flex-1 flex-col overflow-hidden border-y border-border">

    <!-- UI View Mode -->
    <div id="settings-ui-container" data-ui="settings-body" class="flex flex-1 min-h-0 overflow-hidden">
      <nav id="settings-nav" data-ui="settings-nav" class="flex w-52 max-w-1/3 shrink-0 flex-col gap-0.5 overflow-y-auto border-r border-border p-3" aria-label="Settings categories"></nav>
      <section id="settings-list" data-ui="settings-list" class="flex flex-1 min-w-0 flex-col overflow-y-auto px-6 py-2" aria-label="Settings list"></section>
    </div>

    <!-- JSON View Mode -->
    <div id="settings-json-container" data-ui="settings-json-body" class="flex flex-1 min-h-0 flex-col overflow-hidden" hidden>
      <div data-ui="settings-json-toolbar" class="flex items-center justify-between p-3 text-muted-foreground">
        <span class="text-muted-foreground">Edit settings.json directly. Changes apply immediately upon saving.</span>
        <div data-ui="settings-json-actions" class="flex items-center gap-2">
          <button id="btn-settings-reset-raw" title="Discard unsaved changes" class="btn" data-control="settings-btn-secondary" data-variant="outline" data-size="xs">Discard</button>
          <button id="btn-settings-save-raw" title="Save changes to settings.json ({Mod+S})" class="btn" data-control="settings-btn-primary" data-variant="primary" data-size="xs">Save</button>
        </div>
      </div>
      <div id="settings-raw-error" data-ui="settings-error-banner" class="alert [&.success]:text-gi" hidden></div>
      <textarea id="settings-raw-editor" aria-label="Settings JSON" spellcheck="false" autocomplete="off" wrap="off" class="textarea flex-1 min-h-0 resize-none font-mono"></textarea>
    </div>

    <!-- Settings Footer with Explicit Save Button -->
    </section><footer id="settings-footer" class="flex-row! items-center justify-between shrink-0">
      <div id="settings-footer-status" data-ui="settings-footer-status" class="flex items-center gap-2 text-muted-foreground [&.is-saved]:text-gi [&.is-error]:text-destructive [&.is-unsaved]:text-warn [&.is-saving]:text-primary-text is-saved">
        <span id="settings-status-icon" class="icon-[lucide--check] size-3.5 shrink-0" aria-hidden="true"></span>
        <span id="settings-status-text">All changes saved</span>
      </div>
      <div data-ui="settings-footer-actions" class="flex items-center gap-2">
        <button type="button" id="btn-settings-save" title="Save settings ({Mod+S})" class="btn" data-control="settings-btn-save" data-variant="primary" data-size="xs">
          <span class="icon-[lucide--save] size-3.5 shrink-0 settings-btn-save-icon" aria-hidden="true"></span>
          <span id="settings-btn-save-label">Save</span>
        </button>
      </div>
    </footer>
  </div>
</dialog>

<!-- Markdown Image Lightbox Overlay -->






<!-- Invisible text node to measure font metrics in DOM -->
<span id="measure">0</span>

<script src="static/app.js"></script>
</body>
</html>
